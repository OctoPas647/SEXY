name: Build APK

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Release signing (optional). Add these repo secrets once so every APK has the same signature
      # and installs as an update: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
      # Without them the APK is signed with a throwaway debug key.
      - name: Decode keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # Version name: the tag (v1.0 -> 1.0), the release branch (release/v1.0 -> 1.0), else 1.0.<run>.
          case "$GITHUB_REF" in
            refs/tags/v*)        export VERSION_NAME="${GITHUB_REF_NAME#v}" ;;
            refs/heads/release/*) n="${GITHUB_REF#refs/heads/release/}"; export VERSION_NAME="${n#v}" ;;
            *)                   export VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}" ;;
          esac
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEXY-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshots/

      # Publish a GitHub Release when a v* tag is pushed, or when a release/v* branch is pushed
      # (then this step creates the tag). If the release already exists, the APK is replaced.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="$GITHUB_REF_NAME" ;;
            *)           TAG="${GITHUB_REF#refs/heads/release/}" ;;
          esac
          cp app/build/outputs/apk/release/app-release.apk "SEXY-${TAG}.apk"
          gh release create "$TAG" "SEXY-${TAG}.apk" --target "$GITHUB_SHA" --title "SEXY $TAG" --generate-notes \
            || gh release upload "$TAG" "SEXY-${TAG}.apk" --clobber
